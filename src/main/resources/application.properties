spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_practice?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 周报定时提醒：默认每周五 09:00 提醒未提交成员（cron：秒 分 时 日 月 周）
report.reminder.cron=0 0 9 ? * FRI

# Redis 连接配置（默认就是 localhost:6379，密码为空）
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 如果 Redis 设了密码，写下面这行
# spring.redis.password=

# 缓存配置（Spring Cache）
spring.cache.type=redis
# 5分钟
spring.cache.redis.time-to-live=300000ms
spring.cache.redis.cache-null-values=false

# servlet 容器的异步请求超时：AI 问答改成了 SSE 流式，走的是异步请求。
# 不设的话会用底层容器的默认值（Spring Boot 在这一项上没有默认值），长回答可能被提前掐断。
# 前端单次 AI 请求的上限是 90 秒，这里留出余量。
spring.mvc.async.request-timeout=2m

# Spring AI 配置（DeepSeek 兼容 OpenAI API）
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat

# 仅用于 embedding；不配 chat.* 就不会占用 Ollama 的对话模型
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=bge-m3

# 两个 starter 共存时必须显式指定「每种能力用哪个 provider」，
# 否则两者都因 matchIfMissing=true 生效 → 两个 ChatModel / 两个 EmbeddingModel → 注入歧义
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

# PGvector 专用数据源（前缀是自定义的 app.*，不是 spring.datasource）
app.vector-store.pg.url=jdbc:postgresql://postgres:5432/vectordb
app.vector-store.pg.username=postgres
app.vector-store.pg.password=${POSTGRES_PASSWORD:}
app.vector-store.pg.driver-class-name=org.postgresql.Driver

# 持久化向量库不用每次启动重建；首次部署临时设为 true
app.vector-store.rebuild-on-startup=true